<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #control {
      padding: 0.5rem;
      background: #f0f0f0;
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    #urlInput {
      flex: 1;
      padding: 0.5rem;
      font-size: 1rem;
    }
    #loadBtn {
      padding: 0.5rem 1rem;
      font-size: 1rem;
    }
    #viewer {
      flex: 1;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="control">
    <input type="text" id="urlInput" placeholder="" />
    <button id="loadBtn">Load</button>
  </div>
  <iframe id="viewer" src=""></iframe>

  <script>
    const input = document.getElementById('urlInput');
    const button = document.getElementById('loadBtn');
    const viewer = document.getElementById('viewer');

    button.addEventListener('click', () => {
      const subdomain = input.value.trim();
      if (/^[a-zA-Z0-9\-]+$/.test(subdomain)) {
        const url = `https://${subdomain}.wordpress.com/`;
        viewer.src = url;
        input.value = ""; // clear
      } else {
        alert("enter wordpress username");
      }
    });
  </script>
</body>
</html>
